<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Infra Server Project</title>
</head>
<body>
    <h1>Infra Server Project</h1>
    <p>Nginx → Java → MariaDB</p>

    <h2>메시지 등록</h2>
    <form action="/api/messages" method="POST">
        <label for="message">메시지</label>
        <input
            type="text"
            id="message"
            name="message"
            maxlength="100"
            required
        >
        <button type="submit">등록</button>
    </form>

    <h2>메시지 조회</h2>
    <p><a href="/api/db">저장된 메시지 확인</a></p>
</body>
</html>
